name: CI/CD Pipeline

on:
  push:
    branches: ['**']
  pull_request:
    branches: [ develop, main, publish ]

concurrency:
  group: game-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # 腾讯云容器镜像服务配置 (香港区域)
  REGISTRY: hkccr.ccs.tencentyun.com
  NAMESPACE: gdgeek
  IMAGE_NAME: wechat
  FRONTEND_IMAGE_NAME: checkin-frontend

jobs:
  # ==================== 阶段 1: 测试 ====================
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mariadb:10.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_mysql, pdo_sqlite, gd, redis
          coverage: xdebug

      - name: Get Composer cache directory
        id: composer-cache
        working-directory: ./api
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('api/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        working-directory: ./api
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Create test config
        working-directory: ./api
        run: |
          mkdir -p config
          cp ../files/api/config/console.php config/console.php
          cp ../files/api/config/test.php config/test.php
          cp ../files/api/config/params.php config/params.php
          # 创建测试数据库配置
          cat > config/test_db.php << 'EOF'
          <?php
          return [
              'class' => 'yii\db\Connection',
              'dsn' => 'mysql:host=127.0.0.1;dbname=test_db',
              'username' => 'test_user',
              'password' => 'test_password',
              'charset' => 'utf8',
          ];
          EOF
          cat > config/db.php << 'EOF'
          <?php
          return require __DIR__ . '/test_db.php';
          EOF

      - name: Build test actors
        working-directory: ./api
        run: php vendor/bin/codecept build --no-interaction

      - name: Run database migrations
        working-directory: ./api
        run: php tests/bin/yii migrate --interactive=0

      - name: Run unit tests
        working-directory: ./api
        env:
          ADMIN_AUTH_REDIS_HOST: 127.0.0.1
          ADMIN_AUTH_REDIS_PORT: '6379'
          ADMIN_AUTH_REDIS_DB: '15'
        run: php vendor/bin/codecept run unit --no-interaction

      - name: Run functional tests
        working-directory: ./api
        run: php vendor/bin/codecept run functional --no-interaction

  frontend_test_build:
    name: Frontend test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build -- --base=/

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        if: >-
          github.event_name == 'push' && (
            github.ref == 'refs/heads/develop' ||
            github.ref == 'refs/heads/main' ||
            github.ref == 'refs/heads/publish'
          )
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 1

  # ==================== 阶段 2: 构建并发布 ====================
  build:
    name: Build and publish
    runs-on: ubuntu-latest
    needs: [test, frontend_test_build]
    if: >-
      github.event_name == 'push' && (
        github.ref == 'refs/heads/develop' ||
        github.ref == 'refs/heads/main' ||
        github.ref == 'refs/heads/publish'
      )

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_mysql, gd, redis
          coverage: none

      - name: Install application dependencies
        working-directory: ./api
        run: composer install --prefer-dist --no-progress --no-interaction --optimize-autoloader

      - name: Write build metadata
        run: |
          printf '%s\n' "$GITHUB_SHA" > api/GIT_COMMIT
          TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S' > api/BUILD_TIME

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Tencent Cloud Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/publish' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./dockerfile/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image push summary
        run: |
          echo "✅ Docker image pushed successfully!"
          echo "📦 Registry: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}"
          echo "🏷️ Tags:"
          echo "${{ steps.meta.outputs.tags }}" | tr ',' '\n' | sed 's/^/   - /'

  frontend_build:
    name: Build and publish frontend
    runs-on: ubuntu-latest
    needs: [test, frontend_test_build]
    if: >-
      github.event_name == 'push' && (
        github.ref == 'refs/heads/develop' ||
        github.ref == 'refs/heads/main' ||
        github.ref == 'refs/heads/publish'
      )

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: ${{ runner.temp }}/frontend-dist

      - name: Prepare frontend image context
        id: frontend-context
        run: |
          context=$(mktemp -d "$RUNNER_TEMP/frontend-image.XXXXXX")
          mkdir -p "$context/frontend" "$context/dockerfile"
          cp -R "$RUNNER_TEMP/frontend-dist" "$context/frontend/dist"
          cp dockerfile/FrontendDockerfile "$context/Dockerfile"
          cp dockerfile/frontend-nginx.conf.template "$context/dockerfile/"
          cp dockerfile/40-configure-frontends.sh "$context/dockerfile/"
          cp dockerfile/50-configure-miniprogram.sh "$context/dockerfile/"
          echo "path=$context" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Tencent Cloud Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Extract frontend metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.FRONTEND_IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/publish' }}

      - name: Build and push frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ steps.frontend-context.outputs.path }}
          file: ${{ steps.frontend-context.outputs.path }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Frontend image push summary
        run: |
          echo "✅ Frontend Docker image pushed successfully!"
          echo "📦 Registry: ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.FRONTEND_IMAGE_NAME }}"
          echo "🏷️ Tags:"
          echo "${{ steps.meta.outputs.tags }}" | tr ',' '\n' | sed 's/^/   - /'

  # ==================== 阶段 3: 发布说明 ====================
  publish_notice:
    name: Publish notice
    runs-on: ubuntu-latest
    needs: [build, frontend_build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/publish'

    steps:
      - name: Record published images
        run: |
          {
            echo "### Images published"
            echo '- `${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:publish`'
            echo '- `${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.IMAGE_NAME }}:latest`'
            echo '- `${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.FRONTEND_IMAGE_NAME }}:publish`'
            echo '- `${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ env.FRONTEND_IMAGE_NAME }}:latest`'
            echo 'Deployment is managed by the external environment.'
          } >> "$GITHUB_STEP_SUMMARY"
